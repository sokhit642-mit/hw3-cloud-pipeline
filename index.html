<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Northstar - Major Release v2.0.0</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #090d16 0%, #111827 100%); color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; }
        .container { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 3rem 2.5rem; max-width: 650px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .badge { display: inline-block; padding: 0.4rem 1.2rem; background: #6366f1; color: #ffffff; border-radius: 9999px; font-weight: 700; font-size: 0.95rem; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 1.5rem; box-shadow: 0 0 20px rgba(99, 102, 241, 0.5); }
        h1 { font-size: 2.5rem; margin-bottom: 1rem; background: linear-gradient(to right, #a5b4fc, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: #94a3b8; font-size: 1.15rem; line-height: 1.6; margin-bottom: 2rem; }
        .meta-box { background: #0f172a; padding: 1rem; border-radius: 8px; border: 1px solid #1e293b; font-size: 0.9rem; color: #38bdf8; font-family: monospace; }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">Major Release v2.0.0</div>
        <h1>Enterprise Cloud Architecture</h1>
        <p>Zero-downtime rolling update deployed via Jenkins tag triggers to Docker Swarm on AWS EC2.</p>
        <div class="meta-box">Current Active SemVer: v2.0.0 | Environment: Production</div>
    </div>
</body>
</html>
